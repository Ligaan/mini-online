syntax = "proto3";
package game;

message Input {
    uint32 seq = 1;
    sint32 dx = 2;
    sint32 dy = 3;
}

message Join {
    string ticket = 1;
}

message ClientMessage {
    oneof body {
        Join join = 1;
        Input input = 2;
    }
}

message Entity {
    uint32 id = 1;
    float x = 2;
    float y = 3;
}

message Snapshot{
    uint32 tick = 1;
    uint32 last_seq = 2;
    uint32 your_id = 3;
    repeated Entity entities = 4;
}