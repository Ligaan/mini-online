services:
  matchmaker:
    build:
      context: .
      dockerfile: matchmaker/Dockerfile
    image: mini-online-matchmaker
    init: true
    environment:
      MM_SECRET: ${MM_SECRET:-dev-secret-change-me}
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  gameserver:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: mini-online-server
    init: true
    depends_on:
      - matchmaker
    environment:
      MM_SECRET: ${MM_SECRET:-dev-secret-change-me}
      MM_GRPC_ADDR: matchmaker:50051
      GAME_CONTROL_ADDR: gameserver:50052
      GAME_PUBLIC_ADDR: ${PI_ADDR:-192.168.137.129}:9000
    ports:
      - "9000:9000/udp"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  redis-data: